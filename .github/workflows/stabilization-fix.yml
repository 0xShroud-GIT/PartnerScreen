name: Chirp Stabilization Patch

on:
  push:
    branches: [fix/persist-media-diagnostics]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'bootstrap stabilization patch workflow')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-media-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci --no-audit --no-fund
      - run: node scripts/apply-stabilization-batch.mjs
      - run: npm run ci
      - name: Commit verified stabilization patch
        run: |
          rm scripts/apply-stabilization-batch.mjs
          rm .github/workflows/stabilization-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden presence and persistent diagnostics"
          git push origin HEAD:fix/persist-media-diagnostics
