name: Source gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and config
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Product tests
        run: npm run test:product

      - name: Static contracts
        run: npm run check:contracts

      - name: Baseline checks
        run: npm run check:baseline

      - name: Repository sanitation
        run: npm run sanitize

      - name: Expo config check
        run: npm run config:check

      - name: Expo dependency check
        run: npm run deps:check

      - name: Android prebuild config validation
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
