name: P0Q2 build exact merged main 3d16709

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p0q2-build-3d16709
  cancel-in-progress: true

env:
  PARTNERSCREEN_BUILD_COMMIT: 3d16709e1c016bd337738a393252d507901c5d7a
  PARTNERSCREEN_ABIS: arm64-v8a,x86_64

jobs:
  build:
    name: Build exact merged main APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out exact merged main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARTNERSCREEN_BUILD_COMMIT }}

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Building source SHA: $actual"
          test "$actual" = "$PARTNERSCREEN_BUILD_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Product tests
        run: npm run test:product

      - name: Runtime Lab integration
        run: npm run test:runtime-lab

      - name: Runtime Lab 10k fuzz
        run: npm run test:runtime-lab:fuzz

      - name: Known regressions
        run: npm run test:runtime-lab:known

      - name: Static contracts
        run: npm run check:contracts

      - name: Baseline checks
        run: npm run check:baseline

      - name: Repository sanitation
        run: npm run sanitize

      - name: Expo config check
        run: npm run config:check

      - name: Expo dependency check
        run: npm run deps:check

      - name: Android build preflight
        run: npm run build:dev-apk -- --preflight

      - name: Build development APK
        run: npm run build:dev-apk

      - name: Record APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(artifacts/build-metadata/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          sha256sum "${apks[0]}" | tee artifacts/build-metadata/SHA256SUMS.txt

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: partnerscreen-p0q2-3d16709
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/build-metadata/*.apk
            artifacts/build-metadata/*.DEVELOPMENT_ONLY.txt
            artifacts/build-metadata/SHA256SUMS.txt

# Temporary compile-only qualification workflow.
# Always checks out and stamps exact merged main SHA 3d16709... .
# No Maestro/emulator/device job is present.
