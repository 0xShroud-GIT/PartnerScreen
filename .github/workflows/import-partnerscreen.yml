name: Import canonical PartnerScreen tree

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.repository == '0xShroud-GIT/PartnerScreen' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and reconstruct canonical repository
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .import/part00 .import/part01 .import/part02 .import/part03 \
            .import/fix040 .import/fix041 .import/fix042 \
            .import/part05 .import/part06 .import/part07 .import/part08 \
            .import/part09 .import/part10 .import/part11 .import/part12 \
            .import/part13 .import/part14 .import/part15 \
            > /tmp/partnerscreen-import.b64

          base64 --decode /tmp/partnerscreen-import.b64 > /tmp/partnerscreen-import.tar.xz
          xz --test /tmp/partnerscreen-import.tar.xz

          mkdir -p /tmp/partnerscreen-canonical
          tar -xJf /tmp/partnerscreen-import.tar.xz -C /tmp/partnerscreen-canonical

          test "$(find /tmp/partnerscreen-canonical -type f | wc -l | tr -d ' ')" = '168'
          test -f /tmp/partnerscreen-canonical/README.md
          test -f /tmp/partnerscreen-canonical/AGENTS.md
          test -f /tmp/partnerscreen-canonical/CHECKPOINT.md
          test -f /tmp/partnerscreen-canonical/package.json
          test -f /tmp/partnerscreen-canonical/package-lock.json
          test -d /tmp/partnerscreen-canonical/app
          test -d /tmp/partnerscreen-canonical/src
          test -d /tmp/partnerscreen-canonical/modules
          test -d /tmp/partnerscreen-canonical/tests
          test -d /tmp/partnerscreen-canonical/docs

          git -C /tmp/partnerscreen-canonical init -q
          git -C /tmp/partnerscreen-canonical add -A
          tree_sha="$(git -C /tmp/partnerscreen-canonical write-tree)"
          echo "canonical tree: $tree_sha"
          test "$tree_sha" = '627235b5739c127db6667660c81a7051b7c48893'
          rm -rf /tmp/partnerscreen-canonical/.git

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/partnerscreen-canonical/. .
          test ! -e .import
          test ! -e .github

          git config user.name '0xShroud-GIT'
          git config user.email '0xshroud.me@gmail.com'
          git add -A
          final_tree="$(git write-tree)"
          echo "final tree: $final_tree"
          test "$final_tree" = '627235b5739c127db6667660c81a7051b7c48893'
          git commit -m 'Import canonical PartnerScreen working repository'
          git push origin HEAD:main
