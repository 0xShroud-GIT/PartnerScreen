name: Runtime Laboratory

on:
  push:
    branches:
      - 'm0r/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-twin:
    name: Two-peer twin and lifecycle fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Runtime Lab integration
        run: npm run test:runtime-lab

      - name: Runtime Lab 10k lifecycle fuzz
        run: npm run test:runtime-lab:fuzz

      - name: Typecheck application
        run: npm run typecheck

# Intentionally no Expo prebuild, Gradle, APK, emulator or Maestro in this workflow.
# Mission 0R is the seconds-fast software laboratory. Native/emulator qualification
# is a separate manually invoked layer and must never be triggered by routine edits.
