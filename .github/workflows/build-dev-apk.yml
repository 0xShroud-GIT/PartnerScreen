name: Build development APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-dev-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PARTNERSCREEN_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Source gate and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      PARTNERSCREEN_ABIS: arm64-v8a,x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARTNERSCREEN_BUILD_COMMIT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK root is not available on the runner" >&2
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Product tests
        run: npm run test:product

      - name: Static contracts
        run: npm run check:contracts

      - name: Baseline checks
        run: npm run check:baseline

      - name: Repository sanitation
        run: npm run sanitize

      - name: Expo config check
        run: npm run config:check

      - name: Expo dependency check
        run: npm run deps:check

      - name: Android build preflight
        run: npm run build:dev-apk -- --preflight

      - name: Build development APK
        run: npm run build:dev-apk

      - name: Record APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(artifacts/build-metadata/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          sha256sum "${apks[0]}" | tee artifacts/build-metadata/SHA256SUMS.txt

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: partnerscreen-dev-apk-${{ env.PARTNERSCREEN_BUILD_COMMIT }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/build-metadata/*.apk
            artifacts/build-metadata/*.DEVELOPMENT_ONLY.txt
            artifacts/build-metadata/SHA256SUMS.txt

  maestro:
    name: Maestro APK smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out test flow
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARTNERSCREEN_BUILD_COMMIT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download development APK
        uses: actions/download-artifact@v4
        with:
          name: partnerscreen-dev-apk-${{ env.PARTNERSCREEN_BUILD_COMMIT }}
          path: artifacts/maestro-apk

      - name: Install Maestro CLI 2.7.0
        shell: bash
        env:
          MAESTRO_VERSION: 2.7.0
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro smoke test on APK
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: >-
            set -eu; APK="$(find artifacts/maestro-apk -type f -name '*.apk' -print -quit)"; test -n "$APK"; adb install -r "$APK"; adb shell pm path com.partnerscreen.app; maestro test --format junit --output artifacts/maestro-report.xml --test-output-dir=artifacts/maestro-results .maestro/smoke.yaml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partnerscreen-maestro-${{ env.PARTNERSCREEN_BUILD_COMMIT }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/maestro-report.xml
            artifacts/maestro-results/**
