name: M0P Software Qualification

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or commit to qualify'
        required: true
        default: 'arena/01a026b0-partnerscreen'
      expected_sha:
        description: 'Exact SHA expected after checkout'
        required: true
        default: 'f44f0d0031fc4f75c3e38a5fc6e387255cfc2722'

permissions:
  contents: read

jobs:
  software-gate:
    name: Corrected-head software-only gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Verify exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Target SHA: $actual"
          test "$actual" = "${{ inputs.expected_sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Product tests
        run: npm run test:product

      - name: Runtime Lab integration
        run: npm run test:runtime-lab

      - name: Runtime Lab 10k fuzz
        run: npm run test:runtime-lab:fuzz

      - name: Known regressions
        run: npm run test:runtime-lab:known

      - name: Static contracts
        run: npm run check:contracts

      - name: Baseline checks
        run: npm run check:baseline

      - name: Repository sanitation
        run: npm run sanitize

      - name: Expo config check
        run: npm run config:check

      - name: Expo dependency check
        run: npm run deps:check

# Manual software-only gate for Mission 0P.
# Intentionally NO Expo prebuild, Gradle, APK, emulator, Maestro, or device steps.
