name: Chirp structural migration

on:
  push:
    branches: [chirp/clean-runtime]
    paths:
      - 'scripts/chirp-migrate.mjs'
      - '.github/workflows/chirp-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chirp/clean-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Apply structural cleanup
        run: node scripts/chirp-migrate.mjs
      - name: Remove one-shot migration machinery
        run: rm -f scripts/chirp-migrate.mjs .github/workflows/chirp-migrate.yml
      - name: Commit migrated tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "refactor: rename to Chirp and remove obsolete runtime layers"
          git push origin HEAD:chirp/clean-runtime
